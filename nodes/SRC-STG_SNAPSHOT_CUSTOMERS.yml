name: STG_SNAPSHOT_CUSTOMERS
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      MERGE INTO TARGET_DB.PRODUCTION.TARGET_CUSTOMERS AS TGT
      USING SNAPSHOT_DB.STAGING.SNAPSHOT_CUSTOMERS AS SRC
      ON TGT.CUSTOMER_ID = SRC.CUSTOMER_ID
      WHEN MATCHED AND SRC.UPDATED_AT > TGT.UPDATED_AT THEN
          UPDATE SET
              TGT.NAME       = SRC.NAME,
              TGT.EMAIL      = SRC.EMAIL,
              TGT.STATUS     = SRC.STATUS,
              TGT.UPDATED_AT = SRC.UPDATED_AT,
              TGT.LOADED_AT  = CURRENT_TIMESTAMP()
      WHEN NOT MATCHED THEN
          INSERT (CUSTOMER_ID, NAME, EMAIL, STATUS, UPDATED_AT, LOADED_AT)
          VALUES (SRC.CUSTOMER_ID, SRC.NAME, SRC.EMAIL, SRC.STATUS, SRC.UPDATED_AT, CURRENT_TIMESTAMP())
