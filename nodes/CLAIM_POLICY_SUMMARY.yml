operation:
  name: CLAIM_POLICY_SUMMARY
  type: sql
  config:
    insertStrategy: INSERT
    postSQL: "BEGIN\nUSE DATABASE DBSHIFT;\nUPDATE DBSHIFT.DBSHIFT.AO_CLAIM\n\
  SET\n   LOAD_TO_SF_FLAG = 'Y',\n    AO_DATE_UPDATED = CURRENT_TIMESTAMP(),\n\
  \    AO_UPDATE_USER = 'spetl_claim_policy_summary'\nFROM {{ ref('DA_TEST', 'DW_POLICY_CURRENT') }} P\nWHERE DBSHIFT.DBSHIFT.AO_CLAIM.POLICY_NUMBER = P.POLICY_NUMBER\n\
  \  AND DBSHIFT.DBSHIFT.AO_CLAIM.POLICY_EFFECTIVE_DATE = P.POLICY_EFFECTIVE_DATE\n  AND (DBSHIFT.DBSHIFT.AO_CLAIM.LOAD_TO_SF_FLAG\
  \ <> 'Y' OR DBSHIFT.DBSHIFT.AO_CLAIM.LOAD_TO_SF_FLAG IS NULL);\nEND;"
    preSQL: 'BEGIN

      USE DATABASE DBSHIFT;

      TRUNCATE TABLE DBSHIFT.DA_TEST_TGT.CLAIM_POLICY_SUMMARY;

      END;'
    testsEnabled: true
    truncateBefore: true
  database: ''
